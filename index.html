<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKASHGANGA — Spider-Verse Secure Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@500;600;700&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#060810;
    --web-blue:#1c3fae;
    --web-blue-2:#3d63e8;
    --spider-red:#e0242c;
    --spider-red-2:#ff4d4d;
    --star-gold:#ffcc33;
    --web-white:#f2f4f9;
    --line:rgba(242,244,249,.14);
    --glass:rgba(14,20,38,.6);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;background:var(--void);}
  body{
    font-family:'Rajdhani',sans-serif;color:var(--web-white);cursor:none;
    min-height:100vh;position:relative;overflow-x:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:60px 16px;
  }
  h1,h2,h3,.brand{font-family:'Bangers',cursive;letter-spacing:.04em;}
  ::selection{background:var(--spider-red);color:#fff;}
 
  #stars{position:fixed;inset:0;z-index:0;}
 
  /* ---------- web-shooter cursor ---------- */
  #cursor-dot{
    position:fixed;top:0;left:0;width:22px;height:22px;
    pointer-events:none;z-index:9999;transform:translate(-50%,-50%);
    transition:width .12s ease,height .12s ease;
    filter:drop-shadow(0 0 6px rgba(242,244,249,.85));
  }
  #cursor-dot svg{width:100%;height:100%;display:block;}
  #cursor-dot.pulse{width:30px;height:30px;}
  #web-trail-canvas{position:fixed;inset:0;pointer-events:none;z-index:9998;}
 
  /* ---------- header ---------- */
  .portal-header{text-align:center;margin-bottom:34px;position:relative;z-index:1;}
  .portal-eyebrow{
    font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.5em;
    font-size:11px;color:var(--star-gold);text-transform:uppercase;opacity:.85;
  }
  .gradient-text{
    background:linear-gradient(90deg,var(--spider-red) 0%,var(--spider-red-2) 35%,var(--web-blue-2) 70%,var(--web-blue) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .page-title{font-size:clamp(24px,4vw,34px);margin:6px 0 0;}
 
  /* ---------- cards row ---------- */
  .cards-wrap{
    display:flex;gap:36px;flex-wrap:wrap;justify-content:center;align-items:stretch;
    position:relative;z-index:1;max-width:1020px;width:100%;
  }
  .card{
    position:relative;width:420px;max-width:94vw;
    background:var(--glass);border:1px solid var(--line);border-radius:20px;
    padding:40px 34px 34px;backdrop-filter:blur(12px);
    box-shadow:0 20px 52px rgba(0,0,0,.5);
    animation:riseIn .7s cubic-bezier(.2,.8,.2,1) both;
    display:flex;flex-direction:column;
  }
  .card.card-1{justify-content:flex-start;}
  .card.card-2{animation-delay:.12s;align-items:center;justify-content:center;}
  @keyframes riseIn{from{opacity:0;transform:translateY(20px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
 
  .card-title{
    font-size:21px;text-align:center;line-height:1.25;margin:0 0 22px;
    padding:14px 16px;border-radius:10px;color:#fff;
    background:linear-gradient(90deg,var(--spider-red),var(--web-blue));
    box-shadow:0 6px 16px rgba(224,36,44,.3);
  }
  .card-mode-label{
    text-align:center;font-size:13px;letter-spacing:.3em;text-transform:uppercase;
    font-weight:600;margin:2px 0 22px;
  }
 
  .field{margin-bottom:17px;}
  .field label{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#9fb0e0;margin-bottom:6px;font-weight:600;}
  .field input{
    width:100%;padding:13px 15px;border-radius:9px;border:1px solid var(--line);
    background:rgba(6,8,16,.55);color:var(--web-white);font-family:'Rajdhani',sans-serif;font-size:16px;
    outline:none;transition:border-color .2s, box-shadow .2s;
  }
  .field input::placeholder{color:#5c6690;}
  .field input:focus{border-color:var(--spider-red-2);box-shadow:0 0 0 3px rgba(224,36,44,.2);}
  .field.error input{border-color:#ff5959;}
  .field-msg{font-size:12px;color:#ff8a8a;min-height:13px;margin-top:4px;display:block;}
 
  .btn{
    width:100%;padding:14px 16px;border-radius:9px;border:none;cursor:none;
    font-family:'Bangers',cursive;font-size:19px;letter-spacing:.05em;color:#fff;
    position:relative;overflow:hidden;margin-top:6px;
    background:linear-gradient(90deg,var(--spider-red),var(--web-blue));
    box-shadow:0 6px 16px rgba(224,36,44,.3);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn .shine{position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(115deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite;}
  @keyframes shine{0%{left:-60%;}45%{left:130%;}100%{left:130%;}}
 
  .divider{
    display:flex;align-items:center;gap:10px;margin:16px 0;
    color:#7381ab;font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}
 
  /* ---------- card 2 : spidey figure ---------- */
  .spidey-stage{
    width:210px;height:210px;position:relative;display:flex;align-items:center;justify-content:center;
    cursor:none;margin-bottom:14px;
  }
  .spidey-glow{
    position:absolute;width:140px;height:140px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 70%);
    filter:blur(4px);
    animation:idleGlow 3.2s ease-in-out infinite;
    transition:width .35s ease, height .35s ease, opacity .35s ease;
  }
 
  /* ---------- layered nest rings behind spidey figure ---------- */
  .nest-layer{position:absolute;border-radius:50%;pointer-events:none;}
  .nest-web{
    width:210px;height:210px;
    background:
      repeating-conic-gradient(from 0deg, rgba(242,244,249,.10) 0deg 2deg, transparent 2deg 15deg);
    -webkit-mask:radial-gradient(circle, transparent 26px, #000 27px);
    mask:radial-gradient(circle, transparent 26px, #000 27px);
    animation:spinSlow 40s linear infinite;
  }
  .nest-ring{border:1px dashed;opacity:.55;}
  .nest-ring-1{width:210px;height:210px;border-color:rgba(61,99,232,.45);animation:spinSlow 14s linear infinite;}
  .nest-ring-2{width:172px;height:172px;border-color:rgba(224,36,44,.4);animation:spinSlow 10s linear infinite reverse;}
  .nest-ring-3{width:136px;height:136px;border-color:rgba(255,204,51,.4);border-style:dotted;animation:spinSlow 18s linear infinite;}
  @keyframes spinSlow{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  @keyframes idleGlow{
    0%,100%{opacity:.35;transform:scale(.9);}
    50%{opacity:.65;transform:scale(1.05);}
  }
  .spidey-stage.active .spidey-glow{
    width:210px;height:210px;opacity:1;
    animation:activeGlow 1.1s ease-in-out infinite;
  }
  @keyframes activeGlow{
    0%,100%{opacity:.75;transform:scale(1);}
    50%{opacity:1;transform:scale(1.15);}
  }
  .spidey-figure{position:relative;z-index:1;width:154px;height:154px;object-fit:contain;transition:transform .35s cubic-bezier(.2,.8,.2,1);}
  .spidey-stage.active .spidey-figure{transform:scale(1.18);}
 
  .thwip-burst{
    position:absolute;z-index:2;top:6px;right:-6px;
    font-family:'Bangers',cursive;font-size:24px;letter-spacing:.05em;
    color:var(--star-gold);text-shadow:0 0 8px rgba(224,36,44,.8),0 0 16px rgba(255,204,51,.6);
    opacity:0;transform:scale(.4) rotate(-8deg);pointer-events:none;
  }
  .thwip-burst.fire{animation:thwipPop .7s cubic-bezier(.2,.8,.2,1) forwards;}
  @keyframes thwipPop{
    0%{opacity:0;transform:scale(.3) rotate(-10deg);}
    30%{opacity:1;transform:scale(1.25) rotate(4deg);}
    55%{transform:scale(1) rotate(-2deg);}
    100%{opacity:0;transform:scale(1.1) rotate(0) translateY(-14px);}
  }
 
  .brand-name{margin-top:10px;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .logo-mark{width:120px;height:68px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));}
  .logo-mark svg{width:100%;height:100%;}
  .brand-title{
    font-family:'Bangers',cursive;font-size:32px;letter-spacing:.06em;
    color:var(--web-white);text-shadow:0 0 12px rgba(224,36,44,.55);
  }
  .brand-tagline{
    font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.35em;
    text-transform:uppercase;color:#8792bb;margin-top:-4px;
  }
 
  footer.note{text-align:center;margin-top:26px;font-size:12px;color:#6c76a0;position:relative;z-index:1;}
  footer.note b{color:var(--star-gold);}
 
  /* ---------- portal transition overlay (submit -> main page) ---------- */
  #portal-transition{
    position:fixed;inset:0;z-index:10000;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 50%, rgba(61,99,232,.35), var(--void) 70%);
  }
  #portal-transition.active{animation:portalIn .9s ease forwards;}
  @keyframes portalIn{
    0%{opacity:0;}
    30%{opacity:1;}
    100%{opacity:1;}
  }
 
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  }
 
  @media (max-width:720px){
    .cards-wrap{gap:26px;}
    .card{width:100%;max-width:460px;}
  }
  @media (max-width:420px){
    body{padding:40px 12px;}
    .card{padding:28px 20px 24px;}
    .card-title{font-size:17px;padding:11px 13px;}
    .spidey-stage{width:170px;height:170px;}
    .nest-web,.nest-ring-1{width:170px;height:170px;}
    .nest-ring-2{width:140px;height:140px;}
    .nest-ring-3{width:110px;height:110px;}
    .spidey-figure{width:120px;height:120px;}
    .logo-mark{width:96px;height:54px;}
    .brand-title{font-size:25px;}
  }
</style>
</head>

    const count = Math.floor((w*h)/9500);
    for(let i=0;i<count;i++){
      stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.3+.3,speed:Math.random()*.4+.05,phase:Math.random()*Math.PI*2,gold:Math.random()<.12});
    }
  }
  function draw(t){
    ctx.fillStyle='#060810'; ctx.fillRect(0,0,w,h);
    for(const s of stars){
      const tw = .5+.5*Math.sin(t*.001*s.speed*4+s.phase);
      ctx.globalAlpha = .25+tw*.75;
      ctx.fillStyle = s.gold ? '#ffcc33' : '#f2f4f9';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',()=>{resize();makeStars();});
  resize(); makeStars(); requestAnimationFrame(draw);
})();
 
/* ---------- web-shooter cursor: shoots a web trail as it moves ---------- */
(function(){
  const dot = document.getElementById('cursor-dot');
  const canvas = document.getElementById('web-trail-canvas');
  const ctx = canvas.getContext('2d');
  let w,h, segments=[], sparks=[];
  function resize(){ w=canvas.width=window.innerWidth; h=canvas.height=window.innerHeight; }
  window.addEventListener('resize', resize); resize();
 
  const SPARK_COLORS = ['224,36,44', '61,99,232']; /* spider-red, web-blue */
 
  function spawnSparks(x,y,count){
    for(let i=0;i<count;i++){
      const angle = Math.random()*Math.PI*2;
      const speed = .6 + Math.random()*1.8;
      sparks.push({
        x, y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        r: .8 + Math.random()*1.6,
        life: 1,
        color: SPARK_COLORS[Math.floor(Math.random()*SPARK_COLORS.length)]
      });
    }
    if(sparks.length>140) sparks.splice(0, sparks.length-140);
  }
 
  let lastX=null, lastY=null;
  function addPoint(x,y){
    dot.style.left = x+'px'; dot.style.top = y+'px';
    const dist = lastX===null ? 999 : Math.hypot(x-lastX,y-lastY);
    if(dist > 4){
      /* just one short straight strand from the last point to this one */
      if(lastX!==null) segments.push({x1:lastX,y1:lastY,x2:x,y2:y,life:1});
      spawnSparks(x,y, 2 + Math.floor(Math.random()*2));
      lastX=x; lastY=y;
      if(segments.length>10) segments.shift();
    }
  }
  window.addEventListener('mousemove', e=> addPoint(e.clientX, e.clientY));
  window.addEventListener('touchmove', e=>{
    const t=e.touches[0]; if(!t) return; addPoint(t.clientX,t.clientY);
  }, {passive:true});
  window.addEventListener('mousedown', ()=>{ dot.classList.add('pulse'); if(lastX!==null) spawnSparks(lastX,lastY,14); });
  window.addEventListener('mouseup', ()=> dot.classList.remove('pulse'));
 
  function render(){
    ctx.clearRect(0,0,w,h);
 
    /* straight white web strands, fading fast */
    for(const s of segments){
      ctx.beginPath();
      ctx.moveTo(s.x1, s.y1);
      ctx.lineTo(s.x2, s.y2);
      ctx.strokeStyle = `rgba(242,244,249,${(0.75*s.life).toFixed(3)})`;
      ctx.lineWidth = 1.4;
      ctx.lineCap='round';
      ctx.stroke();
    }
    segments.forEach(s=>s.life-=0.12);
    segments = segments.filter(s=>s.life>0);
 
    /* tiny red / blue spark balls */
    for(const p of sparks){
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r*p.life, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${p.color},${p.life.toFixed(3)})`;
      ctx.shadowColor = `rgba(${p.color},.9)`;
      ctx.shadowBlur = 4;
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    sparks.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vx*=.94; p.vy*=.94; p.life-=0.028; });
    sparks = sparks.filter(p=>p.life>0);
 
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();
 
/* ---------- voice ---------- */
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1; u.pitch = 1.05; u.volume = .9;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
 
/* ---------- validation ---------- */
function setFieldError(input,msg){
  const field = input.closest('.field');
  field.classList.toggle('error', !!msg);
  field.querySelector('.field-msg').textContent = msg || '';
}
function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
 
/* ---------- card 1: sign-in / sign-up toggle ---------- */
let isSignup = false;
const nameField = document.getElementById('name-field');
const submitLabel = document.getElementById('submit-label');
const switchBtn = document.getElementById('switch-mode');
const switchLabel = document.getElementById('switch-label');
 
switchBtn.addEventListener('click', ()=>{
  isSignup = !isSignup;
  nameField.style.display = isSignup ? 'block' : 'none';
  submitLabel.textContent = isSignup ? 'CREATE ACCOUNT' : 'SUBMIT';
  switchLabel.textContent = isSignup ? 'SIGN-IN' : 'SIGNUP';
});
 
document.getElementById('auth-form').addEventListener('submit', function(e){
  e.preventDefault();
  let ok = true;
  if(isSignup){
    const name = document.getElementById('a-name');
    if(name.value.trim().length < 2){ setFieldError(name,'Enter your name'); ok=false; } else setFieldError(name,'');
  }
  const email = document.getElementById('a-email');
  const pass = document.getElementById('a-password');
  if(!validEmail(email.value)){ setFieldError(email,'Enter a valid email'); ok=false; } else setFieldError(email,'');
  if(pass.value.length < 6){ setFieldError(pass,'At least 6 characters'); ok=false; } else setFieldError(pass,'');
  if(!ok) return;
  speak(isSignup ? 'Welcome to Akashganga. Your web slinger account is ready.' : 'Welcome back, web slinger.');
 
  const submitBtn = this.querySelector('button[type="submit"]');
  submitBtn.style.pointerEvents = 'none';
  submitLabel.textContent = isSignup ? 'CREATING…' : 'SWINGING IN…';
  document.getElementById('portal-transition').classList.add('active');
  setTimeout(()=>{ window.location.href = 'main.html'; }, 900);
});
 
/* ---------- card 2: spidey glow toggle on click ---------- */
const stage = document.getElementById('spidey-stage');
const thwip = document.getElementById('thwip-burst');
stage.addEventListener('click', ()=>{
  const nowActive = stage.classList.toggle('active');
  thwip.classList.remove('fire');
  void thwip.offsetWidth; /* restart animation */
  thwip.classList.add('fire');
  speak('Thwip');
});
</script>
